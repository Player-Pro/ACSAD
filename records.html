<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACSAD | Records</title><link rel="stylesheet" href="style.css"></head><body><header><div><img class="site-logo" src="logo.svg" alt="ACSAD — School Sports Media"><div class="brand">ACSAD<b>.</b></div></div><nav><a href="index.html">Home</a><a href="news.html">News</a><a href="results.html">Results</a><a href="fixtures.html">Fixtures</a><a href="records.html">Records</a><a href="carnival.html">Carnival</a><a href="fame.html">FAME Gaming</a><a href="replays.html">Replays</a></nav></header><main><div class="page-title"><h1>ACSAD Records</h1><p>The ACSAD school-sport record database.</p></div><div id="records"><p class="note">Loading records...</p></div></main><footer><div class="brand">ACSAD<b>.</b></div><p>Alkimos College Sports & Athletics Digital</p></footer><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const e=document.getElementById('records');try{const r=await fetch('https://wnslzagpnsyzhutimpol.supabase.co/rest/v1/records?select=*&order=event.asc',{headers:{apikey:'sb_publishable_2VpkhXmf01sf0nzx3mC9zA_fzAcdOGB',Authorization:'Bearer sb_publishable_2VpkhXmf01sf0nzx3mC9zA_fzAcdOGB'},cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.message||data.error||'Unable to load data.');if(!data.length){e.innerHTML='<p class="note">No records yet.</p>';return}e.innerHTML='<table><thead><tr><th>Event</th><th>Division</th><th>Record</th><th>Year</th><th>Holder</th></tr></thead><tbody>'+data.map(x=>'<tr><td>'+esc(x.event)+'</td><td>'+esc(x.division||'—')+'</td><td>'+esc(x.record_value||'—')+'</td><td>'+esc(x.year||'—')+'</td><td>'+esc(x.holder||'—')+'</td></tr>').join('')+'</tbody></table>';}catch(err){e.innerHTML='<p class="note">Could not load records: '+esc(err.message)+'</p>';}}load();</script></body></html>
