name: ACSAD Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and commit ACSAD Android 1.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.10.2
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip

      - name: Prepare web assets
        run: |
          mkdir -p android/app/src/main/assets
          cp app.html app.css app.js logo.svg manifest.json sw.js supabase.js android/app/src/main/assets/

      - name: Build APK
        working-directory: android
        run: ../gradle-8.10.2/bin/gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Copy APK into releases folder
        run: |
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/ACSAD-Android-1.1.apk
          ls -lh releases/ACSAD-Android-1.1.apk

      - name: Commit APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/ACSAD-Android-1.1.apk
          git commit -m "Add ACSAD Android 1.1 APK" || echo "APK unchanged"
          git push
