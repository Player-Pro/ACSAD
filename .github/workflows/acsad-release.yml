name: ACSAD Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish ACSAD Android 1.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.10.2
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip

      - name: Prepare web assets
        run: |
          mkdir -p android/app/src/main/assets
          cp app.html app.css app.js logo.svg manifest.json sw.js supabase.js android/app/src/main/assets/

      - name: Build APK
        working-directory: android
        run: ../gradle-8.10.2/bin/gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ACSAD-Android-1.1
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if gh release view acsad-v1.1 >/dev/null 2>&1; then
            gh release upload acsad-v1.1 "$APK" --clobber
            gh release edit acsad-v1.1 --title "ACSAD Android v1.1" --notes "ACSAD Android stable release 1.1"
          else
            gh release create acsad-v1.1 "$APK" --title "ACSAD Android v1.1" --notes "ACSAD Android stable release 1.1" --latest
          fi
