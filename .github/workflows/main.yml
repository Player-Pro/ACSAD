name: Build Android APK

# Trigger the workflow every time you push to the main branch
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to manually trigger the build from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Set up Java JDK (Ensure the version matches your project requirements)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    # Step 3: Grant execute permission to the Gradle wrapper
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    # Step 4: Build the Debug APK
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # Step 5: Upload the generated APK so you can download it from GitHub
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
