name: ACSAD Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ACSAD 1.125 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # setup-android installs the command-line tools; do not request the
      # obsolete SDK package named "tools" (it makes this action fail).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # "tools" was removed from the Android SDK and causes setup to fail.
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.10.2
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip

      - name: Prepare web assets
        run: |
          mkdir -p android/app/src/main/assets
          cp app.html app.css app.js app-countdown.js logo.svg manifest.json sw.js supabase.js school-countdown.html style.css android/app/src/main/assets/
          mkdir -p android/app/src/main/assets/audio
          cp -R audio/. android/app/src/main/assets/audio/

      - name: Build v1.125 debug APK
        working-directory: android
        run: ../gradle-8.10.2/bin/gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ACSAD-Android-1.125
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: acsad-v1.125
          name: ACSAD Android v1.125
          body: ACSAD Android app release 1.125 with the original school countdown, tappable articles and ACSAD launcher branding.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true
