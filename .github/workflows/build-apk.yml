name: Build ACSAD APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip
      - name: Prepare web assets
        run: |
          mkdir -p android/app/src/main/assets
          cp app.html app.css app.js logo.svg manifest.json sw.js supabase.js android/app/src/main/assets/
      - name: Build debug APK
        working-directory: android
        run: ../gradle-8.10.2/bin/gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ACSAD-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
