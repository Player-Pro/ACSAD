<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACSAD | Results</title><link rel="stylesheet" href="style.css"></head><body><header><div><div class="brand">ACSAD<b>.</b></div><div class="tag">ALKIMOS COLLEGE SPORTS & ATHLETICS DIGITAL</div></div><nav><a href="index.html">Home</a><a href="news.html">News</a><a href="results.html">Results</a><a href="fixtures.html">Fixtures</a><a href="records.html">Records</a><a href="carnival.html">Carnival</a><a href="fame.html">FAME Gaming</a><a href="replays.html">Replays</a></nav></header><main><div class="page-title"><h1>Results</h1><p>Results and scorelines from Alkimos College sport.</p></div><div id="results"><p class="note">Loading results...</p></div></main><footer><div class="brand">ACSAD<b>.</b></div><p>Alkimos College Sports & Athletics Digital</p></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const e=document.getElementById('results'),{data,error}=await window.acsadSupabase.from('results').select('*').order('result_date',{ascending:false});if(error){e.innerHTML='<p class="note">'+esc(error.message)+'</p>';return}e.innerHTML=data.map(x=>'<div class="card result" style="margin-bottom:18px"><div class="meta">'+esc(x.sport)+' • '+esc(x.event)+'</div><h2>'+esc(x.home_team)+' '+esc(x.home_score??'')+' – '+esc(x.away_score??'')+' '+esc(x.away_team)+'</h2><p><strong>Date:</strong> '+esc(x.date_label||x.result_date||'TBC')+'</p>'+(x.details?'<p>'+esc(x.details)+'</p>':'')+'</div>').join('')||'<p class="note">No results yet.</p>}load();</script></body></html>
