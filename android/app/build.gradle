plugins {
    id 'com.android.application'
}

android {
    namespace 'com.acsad.school'
    compileSdk 35

    defaultConfig {
        applicationId 'com.acsad.school'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.1'
    }
}

tasks.register('syncAcsadWebAssets', Copy) {
    from(rootProject.projectDir) {
        include 'app.html'
        include 'app.css'
        include 'app.js'
        include 'supabase.js'
        include 'logo.svg'
    }
    into(layout.projectDirectory.dir('src/main/assets'))
}

preBuild.dependsOn syncAcsadWebAssets
