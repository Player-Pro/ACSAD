plugins {
    id 'com.android.application'
}

android {
    namespace 'com.acsad.school'
    compileSdk 35

    defaultConfig {
        applicationId 'com.acsad.school'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.1'
    }
}

// Copy the web app from the repository root into the Android asset bundle so
// both local Gradle builds and CI builds package the same application files.
tasks.register('syncAcsadWebAssets', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'app.html'
        include 'app.css'
        include 'app.js'
        include 'supabase.js'
        include 'logo.svg'
        include 'manifest.json'
        include 'sw.js'
    }
    into(layout.projectDirectory.dir('src/main/assets'))
}

preBuild.dependsOn syncAcsadWebAssets
