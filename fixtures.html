rong>Coverage:</strong> <a href="'+esc(x.coverage_url)+'" target="_blank" rel="noopener">Read / watch →</a></p>':'')+'</div>').join('')||'<p class="note">No upcoming fixtures yet.</p>';}catch(err){e.innerHTML='<p class="note">Could not load fixtures: '+esc(err.message)+'</p>';}}load();supabaseClient.channel('acsad-live-fixtures').on('postgres_changes',{event:'*',schema:'public',table:'fixtures'},load).subscribe();setInterval(load,45000);</script></body></html>
