<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACSAD | Fixtures</title><link rel="stylesheet" href="style.css"></head><body><header><div><div class="brand">ACSAD<b>.</b></div><div class="tag">ALKIMOS COLLEGE SPORTS & ATHLETICS DIGITAL</div></div><nav><a href="index.html">Home</a><a href="news.html">News</a><a href="results.html">Results</a><a href="fixtures.html">Fixtures</a><a href="records.html">Records</a><a href="carnival.html">Carnival</a><a href="fame.html">FAME Gaming</a><a href="replays.html">Replays</a></nav></header><main><div class="page-title"><h1>Fixtures</h1><p>Upcoming Alkimos College sports fixtures and events.</p></div><div id="fixtures"><p class="note">Loading fixtures...</p></div></main><footer><div class="brand">ACSAD<b>.</b></div><p>Alkimos College Sports & Athletics Digital</p></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const e=document.getElementById('fixtures'),{data,error}=await window.acsadSupabase.from('fixtures').select('*').order('fixture_date',{ascending:true});if(error){e.innerHTML='<p class="note">'+esc(error.message)+'</p>';return}e.innerHTML=data.map(x=>'<div class="card" style="margin-bottom:18px"><h2>Alkimos College vs '+esc(x.opponent)+'</h2><p><strong>Date:</strong> '+esc(x.date_label||x.fixture_date||'TBC')+'</p><p><strong>Sport:</strong> '+esc(x.sport)+'</p><p><strong>Status:</strong> '+esc(x.status)+'</p>'+(x.details?'<p>'+esc(x.details)+'</p>':'')+(x.coverage_url?'<p><strong>Coverage:</strong> <a href="'+esc(x.coverage_url)+'" target="_blank" rel="noopener">Read / watch →</a></p>':'')+'</div>').join('')||'<p class="note">No upcoming fixtures yet.</p>}load();</script></body></html>
