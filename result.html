<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACSAD | Result</title><link rel="stylesheet" href="style.css"><style>.result-hero{text-align:center}.score{font-size:3rem;font-weight:800;margin:12px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tab{cursor:pointer}.section{display:none}.section.active{display:block}.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{padding:18px;border:1px solid rgba(255,255,255,.12);border-radius:14px}.timeline-item{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.1)}@media(max-width:600px){.score{font-size:2.2rem}.stat-grid{grid-template-columns:1fr}}</style></head><body><header><div><img class="site-logo" src="logo.svg" alt="ACSAD — School Sports Media"><div class="brand">ACSAD<b>.</b></div></div><nav><a href="index.html">Home</a><a href="news.html">News</a><a href="results.html">Results</a><a href="fixtures.html">Fixtures</a><a href="records.html">Records</a><a href="carnival.html">Carnival</a><a href="fame.html">FAME Gaming</a><a href="replays.html">Replays</a></nav></header><main><p><a href="results.html">← Back to Results</a></p><div id="detail"><p class="note">Loading result...</p></div></main><footer><div class="brand">ACSAD<b>.</b></div><p>Alkimos College Sports & Athletics Digital</p></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const id=new URLSearchParams(location.search).get('id');function json(v){try{return typeof v==='string'?JSON.parse(v):v}catch{return null}}async function load(){const e=document.getElementById('detail');if(!id){e.innerHTML='<p class="note">Result not found.</p>';return}try{const r=await fetch('https://wnslzagpnsyzhutimpol.supabase.co/rest/v1/results?id=eq.'+encodeURIComponent(id)+'&select=*',{headers:{apikey:'sb_publishable_2VpkhXmf01sf0nzx3mC9zA_fzAcdOGB'},cache:'no-store'});const d=await r.json();if(!r.ok||!d[0])throw new Error('Result not found.');const x=d[0],timeline=json(x.timeline)||[],news=json(x.news)||[],stats=json(x.stats)||[];e.innerHTML='<section class="card result-hero"><div class="meta">'+esc(x.sport)+' • '+esc(x.event)+'</div><h1>'+esc(x.home_team)+' vs '+esc(x.away_team)+'</h1><div class="score">'+esc(x.home_score??'—')+' – '+esc(x.away_score??'—')+'</div><p>'+esc(x.date_label||x.result_date||'')+'</p></section><div class="tabs"><button class="btn gold tab" onclick="show(0)">Timeline</button><button class="btn tab" onclick="show(1)">News</button><button class="btn tab" onclick="show(2)">Stats</button></div><section class="section active card"><h2>Timeline</h2><div id="timeline">'+(timeline.length?timeline.map(i=>'<div class="timeline-item"><strong>'+esc(i.time||i.minute||'')+'</strong> '+esc(i.text||i.event||i.description||i)+'</div>').join(''):'<p class="note">No timeline events have been added yet.</p>')+'</div></section><section class="section card"><h2>News</h2><div id="news">'+(news.length?news.map(i=>'<div class="timeline-item"><strong>'+esc(i.title||'')+'</strong><p>'+esc(i.text||i.body||'')+'</p></div>').join(''):'<p class="note">No result news has been added yet.</p>')+'</div></section><section class="section card"><h2>Stats</h2><div class="stat-grid">'+(stats.length?stats.map(i=>'<div class="stat"><strong>'+esc(i.label||i.name||'Stat')+'</strong><div>'+esc(i.value??'—')+'</div></div>').join(''):'<p class="note">No match stats have been added yet.</p>')+'</div></section>';}catch(err){e.innerHTML='<p class="note">'+esc(err.message)+'</p>'}}function show(n){document.querySelectorAll('.section').forEach((x,i)=>x.classList.toggle('active',i===n));document.querySelectorAll('.tab').forEach((x,i)=>x.classList.toggle('gold',i===n))}load();</script></body></html>
